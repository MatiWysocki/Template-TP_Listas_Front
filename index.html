<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
   </head>
<body>
    <header>
      <input type="text" placeholder="Buscá una comida" id="buscador">

      <select name="" id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Salta">Salta</option>
        <option value="Formosa">Formosa</option>
        <option value="Chaco">Chaco</option>
        <option value="Tucumán">Tucumán</option>
        <option value="Corrientes">Corrientes</option>
        <option value="Misiones">Misiones</option>
        <option value="Santiago del Estero">Santiago del Estero</option>
        <option value="Catamarca">Catamarca</option>
        <option value="La Rioja">La Rioja</option>
        <option value="Córdoba">Córdoba</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Entre Ríos">Entre Ríos</option>
        <option value="San Juan">San Juan</option>
        <option value="San Luis">San Luis</option>
        <option value="Mendoza">Mendoza</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="La Pampa">La Pampa</option>
        <option value="Neuquén">Neuquén</option>
        <option value="Río Negro">Río Negro</option>
        <option value="Chubut">Chubut</option>
        <option value="Santa Cruz">Santa Cruz</option>
        <option value="Tierra del Fuego">Tierra del Fuego</option> 
        <option value="Patagonia">Patagonia</option>                   
      </select>    

      <select name = "" id = "filtroCategoria">
        <option value = "">Todas las categorías</option>    
      </select> 
    
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class = "addFood">
      <article class = "formcontainer">

        <form id = "agregarComida">
          <div class = "con">
            <label>Nombre de la comida</label> <br>
            <input type = "text" placeholder = "Nombre de la comida" name = "nombre" id = "nombre" required>
          </div>
  
          <div class = "Con">
            <label>Categoría</label> <br>
            <input type = "text" placeholder = "Categoría" id = "categoria">
          </div>
  
          <div class = "con">
            <label>Provincia</label> <br>
            <select name = "" id = "provincia">
              <option value = "" disabled selected>Seleccioná una provincia</option>
              <option value="Jujuy">Jujuy</option>
              <option value="Salta">Salta</option>
              <option value="Formosa">Formosa</option>
              <option value="Chaco">Chaco</option>
              <option value="Tucumán">Tucumán</option>
              <option value="Corrientes">Corrientes</option>
              <option value="Misiones">Misiones</option>
              <option value="Santiago del Estero">Santiago del Estero</option>
              <option value="Catamarca">Catamarca</option>
              <option value="La Rioja">La Rioja</option>
              <option value="Córdoba">Córdoba</option>
              <option value="Santa Fe">Santa Fe</option>
              <option value="Entre Ríos">Entre Ríos</option>
              <option value="San Juan">San Juan</option>
              <option value="San Luis">San Luis</option>
              <option value="Mendoza">Mendoza</option>
              <option value="Buenos Aires">Buenos Aires</option>
              <option value="La Pampa">La Pampa</option>
              <option value="Neuquén">Neuquén</option>
              <option value="Río Negro">Río Negro</option>
              <option value="Chubut">Chubut</option>
              <option value="Santa Cruz">Santa Cruz</option>
              <option value="Tierra del Fuego">Tierra del Fuego</option> 
              <option value="Patagonia">Patagonia</option>              
            </select>
          </div>
  
          <div class = "Con">
            <label>Ingredientes</label> <br>
            <div class = "contenedor-ingredientes">
              <input class = "ingrediente" type = "text" placeholder = "ingredientes" id = "ingredientes" required>
            </div>
            <button type = "button" id = "agregarIngrediente">Agregar Ingredientes</button>
          </div>
  
          <div class = "Con">
            <button type = "submit" class = "submit">Agregar Comida</button>
          </div>
        </form>
      </article>
    </section>

    <script type = "module" src = "./main.js" defer></script>
</body>
</html>
