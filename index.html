<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class = "filtros">
      <input type = "search" id = "buscador" placeholder = "Buscar por nombre, provincia y/o categoría">

      <select id = "filtro_categoría">
        <option value = "Categorías"> Todas las categorías </option>
        <option value = "Parilla"> Parilla </option>
        <option value = "Horno"> Horno </option>
        <option value = "Guiso"> Guiso </option>
        <option value = "Frito"> Frito </option>
      </select>

      <select id = "filtro_provincia">
        <option value = "Provincia"> Todas las provinicas </option>
        <option value = "Buenos Aires"> Buenos Aires </option>
        <option value = "Córdoba"> Córdoba </option>
        <option value = "Santa Fe"> Santa Fe </option>
        <option value = "Tucumán"> Tucumán </option>
        <option value = "Salta "> Salta </option>
        <option value = "Jujuy"> Jujuy </option>
      </select>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id = "Crear Comidas"> 
        <label for = "Nombre"> Nombre de la comida </label>
        <input type = "text" name = "nombre" placeholder = "Nombre Comida" required>

        <label for = "Categoría"> Categoría de la comida </label>
        <input type = "text" name = "categoría" placeholder = "Categoría Comida" required>

        <label for = "Provincia"> Provincia de la comida </label>
        <input type = "text" name = "provincia" placeholder = "Provincia Comida" required>

        <label for = "Ingredientes"> Ingredientes de la comida </label>
        <input type = "text" name = "ingredientes" placeholder = "Ingredientes Comida" required>

        <button type = "Submit"> Crear Comida </button>
      </form>
      <!-- Para el form para agregar comida -->
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
